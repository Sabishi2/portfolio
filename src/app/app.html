      }

    <div class="projects-container section" [class]="getSectionClass(0)">
      <h1 class="mb-1">Projects</h1>
      <pi-carousel-holder-component [projects]=projects
        (clickedItem)="projectClicked($event)"></pi-carousel-holder-component>

      <div class="divider-horizontal" role="separator" aria-label="Divider"></div>

      @for (project of projects; track project.id) {
      <project-page [project]=project [class]="{'display-none': project.id!=highlightedProject}"></project-page>
      }
