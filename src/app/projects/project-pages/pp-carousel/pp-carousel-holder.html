<div class="carousel-container">
    <owl-carousel-o style="width: auto;max-height: 520px;" [options]="customOptions">
        @for (slide of slidesStore(); track slide.id) {
        <ng-template carouselSlide style="width: auto;max-height: 520px;" [id]="slide.id">
            <img style="width: auto;max-height: 520px; border:1px solid black;" [src]="slide.src" [alt]="slide.alt"
                [title]="slide.title">
        </ng-template>
        }
    </owl-carousel-o>
</div>
